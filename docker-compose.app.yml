services:
  web:
    build: .
    restart: always
    command: >
      sh /app/scripts/entrypoint.sh
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      --graceful-timeout 120
      --max-requests 1000
      --max-requests-jitter 100
    volumes:
      - /opt/community_savings/staticfiles:/app/staticfiles
      - /opt/community_savings/media:/app/media
      - /var/www/community_savings/secrets:/app/secrets:ro
    ports:
      - "${WEB_PORT}:8000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      RUN_MIGRATIONS: "0"
    networks:
      - community_savings_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  community_savings_network:
    external: true
