{% extends 'publics/admin/base.html' %}
{% load static %}
{% load i18n %}

{% block content %}
<div id="meetings-minutes" class="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Meeting Minutes</h1>
            {% comment %} <a href="{% url 'meetings:members_meeting' %}" class="px-5 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-all font-medium flex items-center gap-2 shadow-sm">
                <i class="fas fa-arrow-left text-xs"></i> Back
            </a> {% endcomment %}
        </div>

        <!-- Meta Information Card -->
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-xl border border-white/20 mb-8">
            <div class="grid md:grid-cols-3 gap-8">
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-600 ml-1">Meeting Title</label>
                    <input type="text" id="meeting-title" placeholder="e.g. Quarterly Strategy Meeting"
                        class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-transparent focus:bg-white focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500/30 transition-all duration-200 text-slate-800">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-600 ml-1">Meeting Date</label>
                    <input type="date" id="meeting-date" 
                        class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-transparent focus:bg-white focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500/30 transition-all duration-200 text-slate-800">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-600 ml-1">Language</label>
                    <select id="meeting-language" 
                        class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-transparent focus:bg-white focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500/30 transition-all duration-200 text-slate-800 appearance-none">
                        <option value="English">English</option>
                        <option value="French">French</option>
                        <option value="Spanish">Spanish</option>
                        <option value="German">German</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-8">
            <!-- Left Side: Input (Voice/Document) -->
            <div class="space-y-8">
                <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-xl border border-white/20 h-full flex flex-col">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold text-slate-800">Input Method</h2>
                        <div class="flex bg-slate-100 p-1.5 rounded-2xl gap-1">
                            <button onclick="switchTab('voice')" id="tab-voice" 
                                class="px-5 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-white text-emerald-700 shadow-sm border border-slate-200/50">
                                Voice
                            </button>
                            <button onclick="switchTab('document')" id="tab-document" 
                                class="px-5 py-2 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-500 hover:text-slate-700">
                                Document
                            </button>
                        </div>
                    </div>

                    <!-- Voice Input Section -->
                    <div id="section-voice" class="space-y-6">
                        <div class="bg-slate-50 rounded-2xl p-6 border-2 border-dashed border-slate-200 flex flex-col items-center justify-center text-center space-y-4">
                            <div id="recording-status" class="flex flex-col items-center gap-2">
                                <div id="recording-indicator" class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 mb-2 relative">
                                    <i id="mic-icon" class="fas fa-microphone text-2xl"></i>
                                    <div id="pulse-ring" class="hidden absolute inset-0 rounded-full border-4 border-emerald-500/30 animate-ping"></div>
                                </div>
                                <span id="timer" class="text-2xl font-mono font-bold text-slate-800">00:00</span>
                                <span id="status-text" class="text-sm text-slate-500 font-medium">Ready to record</span>
                            </div>

                            <div class="flex flex-wrap justify-center gap-3">
                                <button id="btn-start" class="px-6 py-3 rounded-xl bg-emerald-600 text-white font-bold shadow-lg shadow-emerald-600/20 hover:bg-emerald-700 transition-all flex items-center gap-2 text-sm sm:text-base">
                                    <i class="fas fa-play text-xs"></i> Start
                                </button>
                                <button id="btn-pause" disabled class="px-6 py-3 rounded-xl bg-amber-500 text-white font-bold opacity-50 cursor-not-allowed transition-all flex items-center gap-2 text-sm sm:text-base">
                                    <i class="fas fa-pause text-xs"></i> Pause
                                </button>
                                <button id="btn-resume" class="hidden px-6 py-3 rounded-xl bg-indigo-600 text-white font-bold transition-all flex items-center gap-2 text-sm sm:text-base">
                                    <i class="fas fa-play text-xs"></i> Resume
                                </button>
                                <button id="btn-stop" disabled class="px-6 py-3 rounded-xl bg-rose-600 text-white font-bold opacity-50 cursor-not-allowed transition-all flex items-center gap-2 text-sm sm:text-base">
                                    <i class="fas fa-stop text-xs"></i> Stop
                                </button>
                                <button id="btn-clear" class="px-6 py-3 rounded-xl bg-slate-200 text-slate-600 font-bold hover:bg-slate-300 transition-all flex items-center gap-2 text-sm sm:text-base">
                                    <i class="fas fa-trash-alt text-xs"></i> Clear
                                </button>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-semibold text-slate-600 ml-1">Live Transcript</label>
                            <textarea id="transcript-area" rows="12" placeholder="Transcript will appear here after recording stops..."
                                class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-slate-100 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500/30 transition-all duration-200 text-slate-800 placeholder-slate-400 resize-none overflow-y-auto"></textarea>
                        </div>
                    </div>

                    <!-- Document Input Section -->
                    <div id="section-document" class="hidden space-y-6">
                        <div class="bg-slate-50 rounded-2xl p-8 border-2 border-dashed border-slate-200 flex flex-col items-center justify-center text-center group cursor-pointer hover:border-emerald-400 transition-all"
                            onclick="document.getElementById('file-upload').click()">
                            <input type="file" id="file-upload" class="hidden" accept=".mp3,.wav,.m4a,.docx,.pdf,.txt">
                            <div class="w-16 h-16 rounded-2xl bg-slate-100 flex items-center justify-center text-slate-400 group-hover:bg-emerald-100 group-hover:text-emerald-600 transition-all mb-4">
                                <i class="fas fa-cloud-upload-alt text-3xl"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800">Upload Recording or Document</h3>
                            <p class="text-slate-500 text-sm mt-1">Accepts audio, PDF, DOCX, TXT.</p>
                            <span id="file-name" class="mt-4 text-emerald-600 font-semibold hidden truncate max-w-xs"></span>
                        </div>
                        <button id="btn-transcribe" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-emerald-500/20 hover:shadow-emerald-500/40 transition-all flex items-center justify-center gap-3">
                            <i class="fas fa-magic"></i> Transcribe / Extract Text
                        </button>
                        <div class="space-y-2">
                            <label class="text-sm font-semibold text-slate-600 ml-1">Extracted Text / Transcript</label>
                            <textarea id="document-transcript-area" rows="14" placeholder="Text will be extracted here..."
                                class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-slate-100 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500/30 transition-all duration-200 text-slate-800 placeholder-slate-400 resize-none overflow-y-auto"></textarea>
                        </div>
                    </div>

                    <button id="btn-generate" 
                        class="mt-8 w-full bg-slate-900 text-white font-bold py-5 rounded-2xl shadow-2xl hover:bg-slate-800 transition-all flex items-center justify-center gap-3 relative overflow-hidden group">
                        <span class="relative z-10 flex items-center gap-3">
                            <i class="fas fa-robot text-emerald-400 group-hover:scale-110 transition-transform"></i>
                            Generate Minutes with AI
                        </span>
                        <div id="ai-loader" class="hidden absolute inset-0 bg-slate-900 flex items-center justify-center z-20">
                            <i class="fas fa-circle-notch animate-spin text-2xl text-emerald-400"></i>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Right Side: AI Output -->
            <div class="space-y-8">
                <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-xl border border-white/20 h-full flex flex-col">
                    <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <i class="fas fa-file-alt text-emerald-600"></i> AI Generated Output
                    </h2>

                    <div class="space-y-8 flex-1">
                        <div class="space-y-2">
                            <label class="text-sm font-semibold text-slate-600 ml-1">Meeting Summary</label>
                            <textarea id="output-summary" rows="5" placeholder="Summary will appear here..."
                                class="w-full px-5 py-4 rounded-2xl bg-emerald-50/30 border-emerald-100/50 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 transition-all duration-200 text-slate-800 placeholder-slate-400 resize-none"></textarea>
                        </div>

                        <div class="space-y-2 flex-1">
                            <label class="text-sm font-semibold text-slate-600 ml-1">Professional Minutes</label>
                            <textarea id="output-minutes" rows="18" placeholder="Detailed minutes will appear here..."
                                class="w-full px-5 py-4 rounded-2xl bg-indigo-50/30 border-indigo-100/50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 transition-all duration-200 text-slate-800 placeholder-slate-400 resize-none"></textarea>
                        </div>
                    </div>

                    <button id="btn-save" 
                        class="mt-8 w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold py-5 rounded-2xl shadow-xl shadow-indigo-600/20 hover:shadow-indigo-600/40 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center justify-center gap-3">
                        <i class="fas fa-save"></i> Save to Database
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let mediaRecorder;
let audioChunks = [];
let startTime;
let timerInterval;

function switchTab(tabId) {
    const sectionVoice = document.getElementById('section-voice');
    const sectionDoc = document.getElementById('section-document');
    const tabVoice = document.getElementById('tab-voice');
    const tabDoc = document.getElementById('tab-document');

    if (tabId === 'voice') {
        sectionVoice.classList.remove('hidden');
        sectionDoc.classList.add('hidden');
        tabVoice.className = "px-5 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-white text-emerald-700 shadow-sm border border-slate-200/50";
        tabDoc.className = "px-5 py-2 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-500 hover:text-slate-700";
    } else {
        sectionVoice.classList.add('hidden');
        sectionDoc.classList.remove('hidden');
        tabDoc.className = "px-5 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-white text-emerald-700 shadow-sm border border-slate-200/50";
        tabVoice.className = "px-5 py-2 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-500 hover:text-slate-700";
    }
}

// Media Recorder Logic
document.getElementById('btn-start').addEventListener('click', async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
            const extension = mimeType.includes('webm') ? 'webm' : 'ogg';
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            await transcribeAudio(audioBlob, extension);
        };

        mediaRecorder.start();
        startTimer();
        updateRecordingUI('recording');
    } catch (err) {
        window.toastManager.buildToast().setMessage('Microphone access denied').setType('danger').show();
    }
});

document.getElementById('btn-pause').addEventListener('click', () => {
    mediaRecorder.pause();
    clearInterval(timerInterval);
    updateRecordingUI('paused');
});

document.getElementById('btn-resume').addEventListener('click', () => {
    mediaRecorder.resume();
    startTimer();
    updateRecordingUI('recording');
});

document.getElementById('btn-stop').addEventListener('click', () => {
    mediaRecorder.stop();
    clearInterval(timerInterval);
    updateRecordingUI('ready');
});

document.getElementById('btn-clear').addEventListener('click', () => {
    document.getElementById('timer').innerText = '00:00';
    document.getElementById('transcript-area').value = '';
    audioChunks = [];
});

function startTimer() {
    startTime = startTime || Date.now();
    timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const seconds = Math.floor((elapsed / 1000) % 60);
        const minutes = Math.floor((elapsed / 1000 / 60) % 60);
        document.getElementById('timer').innerText = 
            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }, 1000);
}

function updateRecordingUI(state) {
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnResume = document.getElementById('btn-resume');
    const btnStop = document.getElementById('btn-stop');
    const pulseRing = document.getElementById('pulse-ring');
    const statusText = document.getElementById('status-text');

    if (state === 'recording') {
        btnStart.classList.add('hidden');
        btnResume.classList.add('hidden');
        btnPause.classList.remove('hidden', 'opacity-50', 'cursor-not-allowed');
        btnPause.disabled = false;
        btnStop.classList.remove('opacity-50', 'cursor-not-allowed');
        btnStop.disabled = false;
        pulseRing.classList.remove('hidden');
        statusText.innerText = 'Recording...';
        statusText.className = 'text-sm text-emerald-600 font-bold animate-pulse';
    } else if (state === 'paused') {
        btnPause.classList.add('hidden');
        btnResume.classList.remove('hidden');
        pulseRing.classList.add('hidden');
        statusText.innerText = 'Recording paused';
        statusText.className = 'text-sm text-amber-600 font-bold';
    } else {
        btnStart.classList.remove('hidden');
        btnPause.classList.add('hidden');
        btnResume.classList.add('hidden');
        btnStop.disabled = true;
        btnStop.classList.add('opacity-50', 'cursor-not-allowed');
        pulseRing.classList.add('hidden');
        statusText.innerText = 'Ready to record';
        statusText.className = 'text-sm text-slate-500 font-medium';
    }
}

// File Upload
document.getElementById('file-upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        document.getElementById('file-name').innerText = file.name;
        document.getElementById('file-name').classList.remove('hidden');
    }
});

async function transcribeAudio(blob, extension = 'wav') {
    const formData = new FormData();
    formData.append('audio', blob, `recording.${extension}`);
    formData.append('action', 'transcribe');

    window.toastManager.buildToast().setMessage('Transcribing audio...').setType('info').show();

    try {
        const response = await fetch("{% url 'meetings:meeting_minutes_ai' %}", {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });
        const result = await response.json();
        if (result.status === 'success') {
            document.getElementById('transcript-area').value = result.transcript;
            window.toastManager.buildToast().setMessage('Transcription complete!').setType('success').show();
        } else {
            window.toastManager.buildToast().setMessage(result.message).setType('danger').show();
        }
    } catch (err) {
        window.toastManager.buildToast().setMessage('Transcription failed').setType('danger').show();
    }
}

document.getElementById('btn-transcribe').addEventListener('click', async () => {
    const fileInput = document.getElementById('file-upload');
    if (!fileInput.files.length) return window.toastManager.buildToast().setMessage('Please select a file').setType('warning').show();

    const formData = new FormData();
    formData.append('audio', fileInput.files[0]);
    formData.append('action', 'transcribe');

    document.getElementById('btn-transcribe').disabled = true;
    document.getElementById('btn-transcribe').innerText = 'Transcribing...';

    try {
        const response = await fetch("{% url 'meetings:meeting_minutes_ai' %}", {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });
        const result = await response.json();
        if (result.status === 'success') {
            document.getElementById('document-transcript-area').value = result.transcript;
            window.toastManager.buildToast().setMessage('Transcription complete!').setType('success').show();
        } else {
            window.toastManager.buildToast().setMessage(result.message).setType('danger').show();
        }
    } catch (err) {
        window.toastManager.buildToast().setMessage('Transcription failed').setType('danger').show();
    } finally {
        document.getElementById('btn-transcribe').disabled = false;
        document.getElementById('btn-transcribe').innerHTML = '<i class="fas fa-magic"></i> Transcribe File';
    }
});

// AI Generation
document.getElementById('btn-generate').addEventListener('click', async () => {
    const transcript = document.getElementById('transcript-area').value || document.getElementById('document-transcript-area').value;
    const language = document.getElementById('meeting-language').value;

    if (!transcript) return window.toastManager.buildToast().setMessage('No transcript available to generate minutes').setType('warning').show();

    const aiLoader = document.getElementById('ai-loader');
    aiLoader.classList.remove('hidden');

    const formData = new FormData();
    formData.append('transcript', transcript);
    formData.append('language', language);
    formData.append('action', 'generate');

    try {
        const response = await fetch("{% url 'meetings:meeting_minutes_ai' %}", {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });
        const result = await response.json();
        if (result.status === 'success') {
            document.getElementById('output-summary').value = result.summary;
            // Handle if minutes is returned as an object instead of string
            const minutesValue = typeof result.minutes === 'object' ? JSON.stringify(result.minutes, null, 2) : result.minutes;
            document.getElementById('output-minutes').value = minutesValue;
            window.toastManager.buildToast().setMessage('AI Minutes Generated!').setType('success').show();
        } else {
            window.toastManager.buildToast().setMessage(result.message).setType('danger').show();
        }
    } catch (err) {
        window.toastManager.buildToast().setMessage('AI Generation failed').setType('danger').show();
    } finally {
        aiLoader.classList.add('hidden');
    }
});

// Save to Database
document.getElementById('btn-save').addEventListener('click', async () => {
    const title = document.getElementById('meeting-title').value;
    const date = document.getElementById('meeting-date').value;
    const language = document.getElementById('meeting-language').value;
    const transcript = document.getElementById('transcript-area').value || document.getElementById('document-transcript-area').value;
    const summary = document.getElementById('output-summary').value;
    const minutes = document.getElementById('output-minutes').value;

    if (!title || !date) return window.toastManager.buildToast().setMessage('Title and Date are required').setType('warning').show();

    const formData = new FormData();
    formData.append('title', title);
    formData.append('date', date);
    formData.append('language', language);
    formData.append('transcript', transcript);
    formData.append('summary', summary);
    formData.append('minutes', minutes);
    formData.append('community_id', "{{ community.id }}");

    const saveBtn = document.getElementById('btn-save');
    saveBtn.disabled = true;
    saveBtn.innerText = 'Saving...';

    try {
        const response = await fetch("{% url 'meetings:meeting_minutes_save' %}", {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });
        const result = await response.json();
        if (result.status === 'success') {
            window.toastManager.buildToast().setMessage(result.message).setType('success').show();
            setTimeout(() => window.location.href = "{% url 'meetings:members_meeting' %}", 2000);
        } else {
            window.toastManager.buildToast().setMessage(result.message).setType('danger').show();
        }
    } catch (err) {
        window.toastManager.buildToast().setMessage('Save failed').setType('danger').show();
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fas fa-save"></i> Save to Database';
    }
});
</script>

<style>
/* Smooth transitions */
.active-page { display: block !important; }
textarea { scrollbar-width: thin; scrollbar-color: #e2e8f0 transparent; }
textarea::-webkit-scrollbar { width: 6px; }
textarea::-webkit-scrollbar-track { background: transparent; }
textarea::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 20px; }

@keyframes pulse-emerald {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

.animate-pulse-emerald {
    animation: pulse-emerald 2s infinite;
}
</style>
{% endblock %}
