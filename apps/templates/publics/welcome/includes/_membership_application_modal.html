{% load i18n %} {% load static %}

<div
  id="applyMembershipModal"
  class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4 font-sans"
>
  <div
    class="bg-white rounded-[2rem] shadow-2xl max-w-lg w-full overflow-hidden transform transition-all duration-300 scale-95 opacity-0"
    id="applyModalContent"
  >
    <!-- Modal Header -->
    <div class="p-8 pb-4 flex justify-between items-start">
      <div>
        <h3 class="text-2xl font-black text-slate-800 leading-tight">
          {% trans "Join Community" %}
        </h3>
        <p
          class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1"
        >
          {% trans "Membership Application" %}
        </p>
      </div>
      <button
        id="closeApplyModalBtn"
        class="w-10 h-10 rounded-full bg-slate-50 hover:bg-slate-100 flex items-center justify-center text-slate-400 transition-all"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <form id="applyMembershipForm" class="p-8 pt-4 space-y-6">
      <div
        id="applyModalLoader"
        class="flex flex-col items-center py-10 hidden"
      >
        <div
          class="w-10 h-10 border-4 border-emerald-100 border-t-emerald-600 rounded-full animate-spin"
        ></div>
      </div>

      <div id="applyModalFormContent" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div class="col-span-2">
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1"
              >{% trans "Community Name" %}</label
            >
            <input
              type="text"
              id="applyCommunityName"
              disabled
              class="w-full px-5 py-3.5 bg-slate-50 border-none rounded-2xl text-sm font-bold text-slate-500 cursor-not-allowed"
            />
          </div>
          <div class="col-span-2">
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1"
              >{% trans "Community Code" %}</label
            >
            <input
              type="text"
              id="applyCommunityCode"
              placeholder="{% trans 'Enter community code' %}"
              class="w-full px-5 py-3.5 bg-slate-50 border-2 border-transparent focus:border-emerald-500/20 rounded-2xl text-sm font-bold outline-none transition-all"
            />
          </div>
          <div>
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1"
              >{% trans "First Name" %}</label
            >
            <input
              type="text"
              id="applyFirstName"
              placeholder="{% trans 'First Name' %}"
              class="w-full px-5 py-3.5 bg-slate-50 border-2 border-transparent focus:border-emerald-500/20 rounded-2xl text-sm font-bold outline-none transition-all"
            />
          </div>
          <div>
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1"
              >{% trans "Last Name" %}</label
            >
            <input
              type="text"
              id="applyLastName"
              placeholder="{% trans 'Last Name' %}"
              class="w-full px-5 py-3.5 bg-slate-50 border-2 border-transparent focus:border-emerald-500/20 rounded-2xl text-sm font-bold outline-none transition-all"
            />
          </div>
          <div class="col-span-2">
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1"
              >{% trans "Phone Number" %}</label
            >
            <input
              type="text"
              id="applyPhoneNumber"
              placeholder="{% trans 'Phone Number' %}"
              class="w-full px-5 py-3.5 bg-slate-50 border-2 border-transparent focus:border-emerald-500/20 rounded-2xl text-sm font-bold outline-none transition-all"
            />
          </div>
          <div class="col-span-1">
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1"
              >{% trans "Registration Fee" %}</label
            >
            <input
              type="text"
              id="applyRegFee"
              disabled
              class="w-full px-5 py-3.5 bg-slate-50 border-none rounded-2xl text-sm font-bold text-emerald-600 cursor-not-allowed"
            />
          </div>
          <div class="col-span-1">
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1"
              >{% trans "Applied Role" %}</label
            >
            <input
              type="text"
              id="applyRole"
              disabled
              class="w-full px-5 py-3.5 bg-slate-50 border-none rounded-2xl text-sm font-bold text-slate-500 cursor-not-allowed"
            />
          </div>

          <!-- Document Verification Section -->
          <div class="col-span-2 pt-4 border-t border-slate-100">
            <p
              class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 ml-1"
            >
              {% trans "Identity Verification" %}
            </p>

            <div class="grid grid-cols-1 gap-4">
              <div>
                <label
                  class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1"
                  >{% trans "Document Type" %}</label
                >
                <select
                  id="applyDocType"
                  name="document_type"
                  class="w-full px-5 py-3.5 bg-slate-50 border-2 border-transparent focus:border-emerald-500/20 rounded-2xl text-sm font-bold outline-none transition-all"
                >
                  <option value="id_card">{% trans "National ID" %}</option>
                  <option value="passport">{% trans "Passport" %}</option>
                  <option value="driver_license">
                    {% trans "Driver License" %}
                  </option>
                </select>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div id="docFrontGroup">
                  <label
                    class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1"
                    >{% trans "Document (Front)" %}</label
                  >
                  <div class="relative group">
                    <input
                      type="file"
                      id="applyDocFront"
                      accept="image/*"
                      class="hidden"
                      onchange="updateFileName(this, 'docFrontLabel')"
                    />
                    <label
                      for="applyDocFront"
                      class="flex flex-col items-center justify-center py-4 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-500/40 hover:bg-emerald-50/30 transition-all"
                    >
                      <i
                        class="fas fa-camera text-slate-400 group-hover:text-emerald-500 mb-1"
                      ></i>
                      <span
                        id="docFrontLabel"
                        class="text-xs font-bold text-slate-400 group-hover:text-emerald-600"
                        >{% trans "Choose Photo" %}</span
                      >
                    </label>
                  </div>
                </div>

                <div id="docBackGroup">
                  <label
                    class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1"
                    >{% trans "Document (Back)" %}</label
                  >
                  <div class="relative group">
                    <input
                      type="file"
                      id="applyDocBack"
                      accept="image/*"
                      class="hidden"
                      onchange="updateFileName(this, 'docBackLabel')"
                    />
                    <label
                      for="applyDocBack"
                      class="flex flex-col items-center justify-center py-4 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-500/40 hover:bg-emerald-50/30 transition-all"
                    >
                      <i
                        class="fas fa-camera text-slate-400 group-hover:text-emerald-500 mb-1"
                      ></i>
                      <span
                        id="docBackLabel"
                        class="text-xs font-bold text-slate-400 group-hover:text-emerald-600"
                        >{% trans "Choose Photo" %}</span
                      >
                    </label>
                  </div>
                </div>
              </div>

              <div>
                <label
                  class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1"
                  >{% trans "Selfie with ID (Optional)" %}</label
                >
                <div class="relative group">
                  <input
                    type="file"
                    id="applySelfie"
                    accept="image/*"
                    class="hidden"
                    onchange="updateFileName(this, 'selfieLabel')"
                  />
                  <label
                    for="applySelfie"
                    class="flex flex-col items-center justify-center py-4 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-500/40 hover:bg-emerald-50/30 transition-all"
                  >
                    <div class="flex items-center gap-3">
                      <i
                        class="fas fa-user-circle text-slate-400 group-hover:text-emerald-500"
                      ></i>
                      <span
                        id="selfieLabel"
                        class="text-xs font-bold text-slate-400 group-hover:text-emerald-600"
                        >{% trans "Choose Selfie" %}</span
                      >
                    </div>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="pt-4 flex gap-3">
          <button
            type="button"
            id="cancelApplyBtn"
            class="flex-1 py-3.5 border border-slate-100 text-slate-400 rounded-2xl font-bold text-sm hover:bg-slate-50 transition-all"
          >
            {% trans "Cancel" %}
          </button>
          <button
            type="submit"
            class="flex-1 py-3.5 gradient-bg text-white rounded-2xl font-bold text-sm shadow-xl shadow-emerald-900/20 active:scale-95 transition-all"
          >
            {% trans "Submit Application" %}
          </button>
        </div>
      </div>
    </form>

    <script>
      function updateFileName(input, labelId) {
        const label = document.getElementById(labelId);
        if (input.files && input.files[0]) {
          label.textContent = input.files[0].name;
          label.classList.replace("text-slate-400", "text-emerald-600");
        } else {
          label.textContent = "{% trans 'Choose Photo' %}";
          label.classList.replace("text-emerald-600", "text-slate-400");
        }
      }
    </script>
  </div>
</div>
