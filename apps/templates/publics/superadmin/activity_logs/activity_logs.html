{% extends 'publics/superadmin/base.html' %} {% load static %} {% load i18n %}
{% block content %}

    <div class="space-y-4">
      <div class="flex gap-3">
        <div
          class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center"

          <i class="fas fa-plus text-emerald-700"></i>
        </div>

          </p>

      </div>
      <div class="flex gap-3">
        <div
          class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center"
        >
          <i class="fas fa-user text-blue-700"></i>
        </div>
        <div>
          <p class="font-medium">15 new user registrations</p>
          <p class="text-sm text-slate-500">
            Across 4 community spaces · 1 hour ago

  </div>
</div>

{% endblock %}
