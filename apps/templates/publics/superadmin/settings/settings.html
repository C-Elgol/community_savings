{% extends 'publics/superadmin/base.html' %} {% load static %} {% load i18n %}
{% block content %}
<!-- ========== SETTINGS PAGE ========== -->
<div id="settings" class="page active-page">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
    <h2 class="text-xl font-bold mb-6">System Settings</h2>
    <div class="space-y-4 max-w-md">
      <div>
        <label class="block text-sm font-medium">Platform Name</label
        ><input class="w-full border rounded-xl px-4 py-2" value="NjangiHub" />
      </div>
      <div>
        <label class="block text-sm font-medium">Default Currency</label
        ><select class="w-full border rounded-xl px-4 py-2">
          <option>XAF</option>
          <option>NGN</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium">Maintenance Mode</label
        ><label class="inline-flex items-center gap-2"
          ><input type="checkbox" /> <span class="text-sm">Enable</span></label
        >
      </div>
    </div>
  </div>
</div>

{% endblock %}
