<!doctype html>
<html lang="en">
  {% include 'publics/superadmin/includes/_head.html' %}
  <script src="{% url 'javascript_catalog' %}"></script>
  <body class="bg-slate-50 text-slate-800 antialiased">
    <!-- mobile menu button -->
    <div class="lg:hidden fixed top-4 left-4 z-50">
      <button
        id="menuToggle"
        class="p-3 bg-white rounded-xl shadow-md text-emerald-700"
      >
        <i class="fas fa-bars text-lg"></i>
      </button>
    </div>

    {% include 'publics/superadmin/includes/_sidebar.html' %}

    <!-- ========== MAIN CONTENT ========== -->
    <div class="lg:ml-80 min-h-screen flex flex-col bg-slate-50">
      {% include 'publics/superadmin/includes/_navbar.html' %}

      <!-- main dynamic pages -->
      <main class="flex-1 p-4 md:p-6 lg:p-8 overflow-y-auto" id="mainContent">
        {% block content %} {% endblock %}
      </main>
    </div>

    {% include 'publics/home/includes/_js.html' %}
    <script>
      (function () {
        // Mobile menu toggle
        const menuToggle = document.getElementById("menuToggle");
        if (menuToggle) {
          menuToggle.addEventListener("click", () => {
            document.querySelector(".sidebar").classList.toggle("active");
          });
        }

        // Page navigation
        const navLinks = document.querySelectorAll(".nav-link");
        const pages = document.querySelectorAll(".page");
        const pageTitle = document.getElementById("pageTitle");
        const pageSubtitle = document.getElementById("pageSubtitle");

        const titles = {
          dashboard: {
            title: "SuperAdmin Dashboard",
            subtitle: "Complete system oversight",
          },
          spaces: {
            title: "Community Spaces",
            subtitle: "Manage all tenant workspaces",
          },
          users: {
            title: "User Management",
            subtitle: "Control user access and roles",
          },
          communities: {
            title: "All Communities",
            subtitle: "View all Njangi groups",
          },
          logs: { title: "System Logs", subtitle: "Audit trail and events" },
          activity: {
            title: "Activity Feed",
            subtitle: "Real-time platform activity",
          },
          settings: {
            title: "System Settings",
            subtitle: "Configure platform parameters",
          },
        };

        function activatePage(pageId) {
          const targetPage = document.getElementById(pageId);
          if (targetPage) {
            pages.forEach((p) => p.classList.remove("active-page"));
            targetPage.classList.add("active-page");
          }

          navLinks.forEach((link) => {
            link.classList.remove(
              "nav-item-active",
              "bg-emerald-50",
              "border-l-4",
              "border-emerald-700",
            );
            link.classList.add("nav-item-inactive");
            if (link.dataset.page === pageId) {
              link.classList.add(
                "nav-item-active",
                "bg-emerald-50",
                "border-l-4",
                "border-emerald-700",
              );
              link.classList.remove("nav-item-inactive");
            }
          });

          if (titles[pageId]) {
            if (pageTitle) pageTitle.innerText = titles[pageId].title;
            if (pageSubtitle) pageSubtitle.innerText = titles[pageId].subtitle;
          }

          if (window.innerWidth < 1024) {
            const sidebar = document.querySelector(".sidebar");
            if (sidebar) sidebar.classList.remove("active");
          }
        }

        // Initialize active page based on current URL or default to dashboard
        function initNavigation() {
          const currentPath = window.location.pathname;
          let activePageFound = false;

          navLinks.forEach((link) => {
            const href = link.getAttribute("href");
            if (href && href !== "#" && currentPath.includes(href)) {
              activatePage(link.dataset.page);
              activePageFound = true;
            }
          });

          // If no match by URL, check if there's an active-page already in DOM
          if (!activePageFound) {
            const activePageElement =
              document.querySelector(".page.active-page");
            if (activePageElement) {
              activatePage(activePageElement.id);
            } else {
              // Default to dashboard if on dashboard URL
              if (currentPath.includes("dashboard")) {
                activatePage("dashboard");
              }
            }
          }
        }

        navLinks.forEach((link) => {
          link.addEventListener("click", (e) => {
            const href = link.getAttribute("href");
            if (href && href !== "#" && !href.startsWith("javascript:")) {
              // Allow normal navigation for non-hash links
              return;
            }
            e.preventDefault();
            activatePage(link.dataset.page);
          });
        });

        // Run initialization
        initNavigation();
      })();
    </script>
  </body>
</html>
