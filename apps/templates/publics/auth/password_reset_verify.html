{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NjangiHub · Verify Reset Code</title>
        <script src="{% url 'javascript_catalog' %}"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .njangi-gradient {
            background: linear-gradient(145deg, #0f3b3f 0%, #0b5e4b 70%, #0f766e 100%);
        }
        .input-focus {
            transition: all 0.2s ease;
        }
        .input-focus:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1);
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-0 md:p-4">
    <!-- main container -->
    <div class="w-full min-h-screen md:min-h-0 md:max-w-6xl md:rounded-3xl md:shadow-2xl flex flex-col md:flex-row bg-white overflow-hidden">
        
        <!-- LEFT HALF - BRANDING -->
        <div class="hidden md:flex md:w-1/2 njangi-gradient p-8 lg:p-12 text-white flex-col justify-between relative overflow-hidden">
            <!-- ... (same as above) ... -->
        </div>
        
        <!-- RIGHT HALF - VERIFY FORM -->
        <div class="w-full md:w-1/2 p-6 sm:p-8 lg:p-12 flex flex-col justify-center bg-white">
            
            <!-- header -->
            <div class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-slate-800">Verify Reset Code</h2>
                <p class="text-slate-500 text-sm mt-1">Enter the code sent to {{ email }}</p>
            </div>
            
            <!-- FORM -->
            <form id="password-reset-verify-form" action="{% url 'users:password_reset_verify' email=email %}" method="post" class="space-y-5">
                {% csrf_token %}
                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 flex items-center gap-1">
                        <i class="fas fa-key text-emerald-600 text-xs"></i> Reset Code <span class="text-emerald-600">*</span>
                    </label>
                    <input type="text" id="code" name="code" 
                           class="w-full px-4 py-3.5 border border-slate-200 rounded-xl focus:outline-none input-focus bg-slate-50/50">
                </div>
                
                <button type="submit" id="verify-button" class="w-full bg-gradient-to-r from-emerald-700 to-teal-700 text-white font-semibold py-4 rounded-xl mt-4 hover:opacity-90 transition-all hover-lift flex items-center justify-center gap-2 text-base">
                    <span id="verify-text">Verify Code</span>
                    <span id="verify-loader" class="hidden animate-spin h-5 w-5 border-2 border-t-white border-gray-300 rounded-full ml-2"></span>
                </button>
                
                <p class="text-center text-sm text-slate-500 mt-6">
                    Didn't receive code? <a href="{% url 'users:password_reset_request' %}" class="text-emerald-700 font-semibold hover:underline">Resend Code</a>
                </p>
                <p class="text-center text-sm text-slate-500">
                    Back to <a href="{% url 'users:login' %}" class="text-emerald-700 font-semibold hover:underline">Sign in</a>
                </p>
            </form>
        </div>
    </div>
    
<script src="{% static 'js/common/toast_manager.js' %}"></script>
<script src="{% static 'js/common/loader_manager.js' %}"></script>
<script>
    // Same as verify_2fa.js, but for this form
    document.addEventListener('DOMContentLoaded', function() {
        const loader = new SectionLoaderManager('password-reset-verify-form', 'fill-emerald-600', 0.5);

        const form = document.getElementById('password-reset-verify-form');
        const button = document.getElementById('verify-button');
        const buttonText = document.getElementById('verify-text');
        const buttonLoader = document.getElementById('verify-loader');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            loader.showLoader();
            button.disabled = true;
            buttonText.classList.add('hidden');
            buttonLoader.classList.remove('hidden');

            const formData = new FormData(form);
            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                loader.hideLoader();
                button.disabled = false;
                buttonText.classList.remove('hidden');
                buttonLoader.classList.add('hidden');

                window.toastManager.buildToast()
                    .setMessage(data.message)
                    .setType(data.success ? 'success' : 'error')
                    .setPosition('top-right')
                    .setDuration(5000)
                    .show();

                if (data.success) {
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 1500);
                } else {
                    document.getElementById('code').value = '';
                }
            })
            .catch(error => {
                loader.hideLoader();
                button.disabled = false;
                buttonText.classList.remove('hidden');
                buttonLoader.classList.add('hidden');
                window.toastManager.buildToast()
                    .setMessage('An unexpected error occurred.')
                    .setType('error')
                    .setPosition('top-right')
                    .setDuration(5000)
                    .show();
            });
        });
    });
</script>
</body>
</html>
