{% load static i18n %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NjangiHub · Verify Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");
      * {
        font-family: "Inter", sans-serif;
      }
      .njangi-gradient {
        background: linear-gradient(
          145deg,
          #0f3b3f 0%,
          #0b5e4b 70%,
          #0f766e 100%
        );
      }
      .input-focus {
        transition: all 0.2s ease;
      }
      .input-focus:focus {
        border-color: #0f766e;
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1);
      }
      .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-slate-50 flex items-center justify-center p-0 md:p-4"
  >
    <!-- main container -->
    <div
      class="w-full min-h-screen md:min-h-0 md:max-w-6xl md:rounded-3xl md:shadow-2xl flex flex-col md:flex-row bg-white overflow-hidden"
    >
      <!-- LEFT HALF - BRANDING -->
      <div
        class="hidden md:flex md:w-1/2 njangi-gradient p-8 lg:p-12 text-white flex-col justify-between relative overflow-hidden"
      >
        <!-- ... (same as login/register branding section) ... -->
        <div
          class="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full -mr-20 -mt-20 blur-2xl"
        ></div>
        <div
          class="absolute bottom-0 left-0 w-80 h-80 bg-black/10 rounded-full -ml-40 -mb-40 blur-3xl"
        ></div>

        <div>
          <div class="flex items-center gap-3 mb-12">
            <div
              class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center text-white text-2xl border border-white/30"
            >
              <i class="fas fa-hand-holding-heart"></i>
            </div>
            <span class="text-2xl font-bold tracking-tight"
              >Njangi<span class="font-light text-white/90">Hub</span></span
            >
          </div>

          <h1 class="text-4xl lg:text-5xl font-bold leading-tight mb-6">
            Secure Your Account<br />
            <span class="text-emerald-200">Verify Now</span>
          </h1>

          <div class="space-y-5 mb-12">
            <!-- features ... -->
          </div>
        </div>

        <!-- testimonial ... -->

        <p class="text-sm text-white/60 mt-8">
          © 2026 NjangiHub · All rights reserved
        </p>
      </div>

      <!-- RIGHT HALF - VERIFY FORM -->
      <div
        class="w-full md:w-1/2 p-6 sm:p-8 lg:p-12 flex flex-col justify-center bg-white"
      >
        <!-- header -->
        <div class="mb-8">
          <h2 class="text-2xl lg:text-3xl font-bold text-slate-800">
            Verify Your Code
          </h2>
          <p class="text-slate-500 text-sm mt-1">
            Enter the 6-digit code sent to {{ email }}
          </p>
        </div>

        <!-- FORM -->
        <form
          id="verify-2fa-form"
          action="{% url 'users:verify_2fa' email=email %}"
          method="post"
          class="space-y-5"
        >
          {% csrf_token %}
          <div class="space-y-1.5">
            <label
              class="text-sm font-semibold text-slate-700 flex items-center gap-1"
            >
              <i class="fas fa-key text-emerald-600 text-xs"></i> Verification
              Code <span class="text-emerald-600">*</span>
            </label>
            <input
              type="text"
              id="code"
              name="code"
              class="w-full px-4 py-3.5 border border-slate-200 rounded-xl focus:outline-none input-focus bg-slate-50/50"
            />
          </div>

          <button
            type="submit"
            id="verify-button"
            class="w-full bg-gradient-to-r from-emerald-700 to-teal-700 text-white font-semibold py-4 rounded-xl mt-4 hover:opacity-90 transition-all hover-lift flex items-center justify-center gap-2 text-base"
          >
            <span id="verify-text">Verify Code</span>
            <span
              id="verify-loader"
              class="hidden animate-spin h-5 w-5 border-2 border-t-white border-gray-300 rounded-full ml-2"
            ></span>
          </button>

          <p class="text-center text-sm text-slate-500 mt-6">
            Didn't receive code?
            <a
              href="{% url 'users:register' %}"
              class="text-emerald-700 font-semibold hover:underline"
              >Register again</a
            >
          </p>
        </form>
      </div>
    </div>

    <script src="{% static 'js/common/toast_manager.js' %}"></script>
    <script src="{% static 'js/common/loader_manager.js' %}"></script>
    <script src="{% static 'js/auth/auth_handler.js' %}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        new AuthFormHandler(
          "verify-2fa-form",
          "verify-button",
          "verify-text",
          "verify-loader",
        );
      });
    </script>
  </body>
</html>
